# Migrated to GitVersion 6.x schema. Key changes from the 5.x config:
#  - `tag:` renamed to `label:`
#  - `prevent-increment-of-merged-branch-version:` -> `prevent-increment: { of-merged-branch: }`
#  - pull-request `tag-number-pattern` replaced by the `{Number}` token in `label`
#  - deployment modes remapped to 6.x semantics (5.x ContinuousDeployment ->
#    6.x ContinuousDelivery for incrementing pre-releases; 5.x ContinuousDelivery
#    -> 6.x ManualDeployment for fixed pre-releases).
branches:
  master:
    regex: ^master
    mode: ManualDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
  release:
    regex: ^releases?[/-]
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: true
    pre-release-weight: 1000
  feature:
    regex: ^features?[\/-](?<BranchName>.+)
    mode: ManualDeployment
    label: alpha.{BranchName}
    increment: Inherit
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
  pull-request:
    regex: ^(pull-requests|pull|pr)[\/-](?<Number>\d*)
    mode: ManualDeployment
    label: PullRequest{Number}
    increment: Inherit
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
  hotfix:
    regex: ^hotfix(es)?[/-]
    mode: ManualDeployment
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
  support:
    regex: ^support[/-]
    mode: ManualDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
  develop:
    regex: ^dev(elop)?(ment)?$
    mode: ContinuousDelivery
    label: alpha
    increment: Minor
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    tracks-release-branches: true
    is-release-branch: false
