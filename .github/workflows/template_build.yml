name: Build

on:
  workflow_call:
    inputs:
      Configuration:
        required: true
        type: string
      nugetVersion:
        required: true
        type: string
      SlnPath:
        required: true
        type: string
      SdkCsprojPath:
        required: true
        type: string
      SampleSiteCsprojPath:
        required: true
        type: string
      UnitTestsCsprojPath:
        required: true
        type: string

env:
  dotnetVersion: |
    8.x
    9.x
    10.x
  AZURE_WEBAPP_PACKAGE_PATH: '.'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.dotnetVersion }}
 
      - name: Install dependencies
        run: dotnet restore ${{ inputs.SlnPath }}

      # Runs the credential-free unit tests on every PR (including Dependabot PRs,
      # which have no access to repository secrets). The live-API tests in the
      # PaymentTests namespace need MERCHANT secrets and run later in the
      # workflow_run stage (test_deploy_samplesite.yml).
      - name: Run unit tests
        run: >
          dotnet test ${{ inputs.UnitTestsCsprojPath }}
          --configuration ${{ inputs.Configuration }}
          -p:Version=${{ inputs.nugetVersion }}
          --no-restore
          --filter "FullyQualifiedName~SwedbankPay.Sdk.Tests.UnitTests|FullyQualifiedName~SwedbankPay.Sdk.Tests.Json"

      - name: Publish Sdk Sample site
        run: dotnet publish --configuration ${{ inputs.Configuration }} -p:Version=${{ inputs.nugetVersion }} --no-restore ${{ inputs.SampleSiteCsprojPath }} --output '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/samplesite'

      - name: Archive Sample.AspNetCore
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sample.AspNetCore
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/samplesite

      - name: Nuget pack SwedbankPay.Sdk
        run: dotnet pack ${{ inputs.SdkCsprojPath }} -p:PackageVersion=${{ inputs.nugetVersion }} -p:Version=${{ inputs.nugetVersion }} --no-restore --configuration=${{ inputs.Configuration }} --output=artifacts

      - name: Nuget pack SwedbankPay.Sdk.Extensions
        run: dotnet pack ./src/SwedbankPay.Sdk.Extensions/SwedbankPay.Sdk.Extensions.csproj -p:PackageVersion=${{ inputs.nugetVersion }} -p:Version=${{ inputs.nugetVersion }} --no-restore --configuration=${{ inputs.Configuration }} --output=artifacts

      - name: Archive nuget packages artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact name
          name: packages
          # A file, directory or wildcard pattern that describes what to upload
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg