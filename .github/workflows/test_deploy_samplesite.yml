name: Run unit and ui tests, deploy samplesite 
on:
  workflow_run:
    workflows: ["Dev", "Uat"]
    types: 
      - completed

env:
  dotnetVersion: |
    8.x
    10.x

# Default to read-only; jobs elevate only what they need.
permissions:
  contents: read

# Don't cancel an in-flight deploy; serialize per triggering commit instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  test-unit-ui:
    # Post-merge only. Integration/UI tests need merchant secrets + the Dev
    # environment, so they must NOT run against untrusted PR code (forks,
    # Dependabot). PRs are gated by the secret-free build + unit tests in the
    # Dev workflow; these run after the change lands on develop/release.
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request' }}
    permissions:
      contents: read
      checks: write   # checks-action posts the commit status
    runs-on: ubuntu-latest
    timeout-minutes: 30   # live-API + Cypress against the hosted payment pages
    environment: ${{ github.event.workflow_run.name }}
    outputs:
      sourceEvent: ${{ github.event.workflow_run.event }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                    
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.dotnetVersion }}

      - name: Run SDK Integration Tests
        run: | 
          export SwedbankPay__PayeeId=${{ secrets.MERCHANT_PAYEEID }}
          export SwedbankPay__Token=${{ secrets.MERCHANT_TOKEN }}
          dotnet test ./src/SwedbankPay.Sdk.IntegrationTests/SwedbankPay.Sdk.IntegrationTests.csproj

      - name: Run SDK Unit Tests
        run: | 
          export SwedbankPay__PayeeId=${{ secrets.MERCHANT_PAYEEID }}
          export SwedbankPay__Token=${{ secrets.MERCHANT_TOKEN }}
          dotnet test ./src/SwedbankPay.Sdk.Tests/SwedbankPay.Sdk.Tests.csproj

      - name: Cypress run
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        with:
          working-directory: ./src/Samples/Sample.AspNetCore.UiTests
          start: dotnet run --project ../Sample.AspNetCore/Sample.AspNetCore.csproj --urls https://localhost:5001 --SwedbankPay:PayeeId ${{ secrets.MERCHANT_PAYEEID }} --SwedbankPay:Token ${{ secrets.MERCHANT_TOKEN }}
          wait-on: 'https://localhost:5001'
          browser: chrome
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          
          
      - name: Upload Cypress artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: cypress-screenshots
          path: ./src/Samples/Sample.AspNetCore.UiTests/cypress/screenshots
          if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`
      
      - name: Commit Action Status
        if: ${{ always() }}
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Run Unit and UI tests
          conclusion: ${{ job.status }}
              
  publish_alpha_nuget:
    needs: [test-unit-ui]
    if: ${{ needs.test-unit-ui.outputs.sourceEvent != 'pull_request' && github.event.workflow_run.name == 'Dev' }}
    name: Publish alpha nuget
    permissions:
      contents: read
      actions: read    # action-download-artifact reads the triggering run
      packages: write  # push to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.workflow_run.name }}

    steps:
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: packages
          path: packages
    
      - name: Publish test package to GitHub Package Registry
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{secrets.GITHUB_TOKEN}} --source  https://nuget.pkg.github.com/swedbankpay/index.json --skip-duplicate
  
  publish_sample_site:
    needs: [test-unit-ui]
    if: ${{ needs.test-unit-ui.outputs.sourceEvent != 'pull_request' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/template_publish_webapp.yml
    secrets: inherit
    with:
      Environment: ${{ github.event.workflow_run.name }}
      WorkflowRunId: ${{ github.event.workflow_run.id }}
