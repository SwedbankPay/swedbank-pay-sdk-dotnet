name: Dependabot auto-merge

# Enables GitHub-native auto-merge for Dependabot PRs. Auto-merge only takes
# effect once all required status checks (the secret-free build + unit tests in
# the Dev workflow) pass — GitHub holds the merge until then.
#
# SECURITY: this uses pull_request_target, which runs in the BASE repo context
# with a write token. It is safe ONLY because it never checks out or executes
# the PR's code — it just reads metadata and calls the GitHub API. Do not add a
# checkout step or run any PR-controlled scripts here.
on: pull_request_target

permissions:
  contents: write        # enable auto-merge / merge
  pull-requests: write   # approve + comment

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch + minor: approve and enable auto-merge. Major updates fall through
      # and stay open for manual review (supply-chain safety).
      - name: Approve patch/minor update
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor update
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
