name: Publish WebApp

on:
  workflow_call:
    inputs:
      Environment:
        required: true
        type: string
      WorkflowRunId:
        required: true
        type: string

permissions:
  contents: read
  actions: read   # action-download-artifact reads the triggering run's artifacts

jobs:
  publish_sample_site:
    name: Publish sample site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.Environment }}

    steps:
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          workflow_conclusion: success
          run_id: ${{ inputs.WorkflowRunId }}
          name: Sample.AspNetCore
          path: Sample.AspNetCore
    
      # Substitute secrets + environment URLs into appsettings.json. Uses jq
      # (preinstalled on ubuntu-latest) instead of the unmaintained node12
      # microsoft/variable-substitution action. Only keys already present in the
      # file are set - matching that action's behaviour.
      - name: Substitute appsettings values
        env:
          MERCHANT_TOKEN: ${{ secrets.MERCHANT_TOKEN }}
          MERCHANT_PAYEEID: ${{ secrets.MERCHANT_PAYEEID }}
          MERCHANT_TOKEN_1: ${{ secrets.MERCHANT_TOKEN_1 }}
          MERCHANT_TOKEN_2: ${{ secrets.MERCHANT_TOKEN_2 }}
          MERCHANT_TOKEN_3: ${{ secrets.MERCHANT_TOKEN_3 }}
          BASE_URL: https://swedbankpay-sdk-001-${{ inputs.Environment }}.azurewebsites.net
        run: |
          file=Sample.AspNetCore/appsettings.json
          tmp=$(mktemp)
          jq \
            --arg token "$MERCHANT_TOKEN" \
            --arg payeeId "$MERCHANT_PAYEEID" \
            --arg merchantToken1 "$MERCHANT_TOKEN_1" \
            --arg merchantToken2 "$MERCHANT_TOKEN_2" \
            --arg merchantToken3 "$MERCHANT_TOKEN_3" \
            --arg base "$BASE_URL" \
            '.SwedbankPay.Token = $token
             | .SwedbankPay.PayeeId = $payeeId
             | .SwedbankPay.Merchants[0].Token = $merchantToken1
             | .SwedbankPay.Merchants[1].Token = $merchantToken2
             | .SwedbankPay.Merchants[2].Token = $merchantToken3
             | .Urls.TermsOfServiceUrl = $base + "/Checkout/Thankyou"
             | .Urls.CallBackUrl       = $base + "/Checkout/Callback"
             | .Urls.CancelUrl         = $base + "/Checkout/Aborted"
             | .Urls.CompleteUrl       = $base + "/Checkout/Thankyou"
             | .Urls.PaymentUrl        = $base + "/CheckOut/LoadPaymentMenu"
             | .Urls.HostUrls[0]       = $base + "/"' \
            "$file" > "$tmp" && mv "$tmp" "$file"

      - name: 'Run Azure webapp deploy using publish profile credentials'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with: 
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # Replace with your app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # Define secret variable in repository settings as per action documentation
          package: 'Sample.AspNetCore'