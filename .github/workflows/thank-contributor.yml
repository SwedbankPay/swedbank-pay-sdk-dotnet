name: Thank contributor

# Ports the Mergify "Thank contributor" rule: comment on a PR once it is merged.
# Skips bot authors (e.g. dependabot) to avoid noise.
#
# SECURITY: pull_request_target runs with a write token in the base-repo
# context. Safe here only because it never checks out or runs PR code — it just
# posts a comment via the GitHub API.
on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write
jobs:
  thank:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Comment a thank-you
        run: gh pr comment "$PR_URL" --body "Thank you @${AUTHOR} for your contribution!"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
