name: Create version number

on:
  workflow_call:
    outputs:
      nugetVersion:
        description: "Nuget version"
        value: ${{ jobs.version.outputs.nugetVersion }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # GitVersion 6 removed the NuGetVersionV2 variable; SemVer is the
      # SemVer 2.0-compatible value for NuGet (no +buildmetadata, unlike FullSemVer).
      nugetVersion: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
        with:
          versionSpec: '6.x'

      - name: Use GitVersion
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@0fdbe2ead9fe738c667f978d1baf448b1b6fb853 # v4.7.1