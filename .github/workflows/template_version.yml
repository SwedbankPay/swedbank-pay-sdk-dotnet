name: Create version number

on:
  workflow_call:
    outputs:
      nugetVersion:
        description: "Nuget version"
        value: ${{ jobs.version.outputs.nugetVersion }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # GitVersion 6 removed the NuGetVersionV2 variable; SemVer is the
      # SemVer 2.0-compatible value for NuGet (no +buildmetadata, unlike FullSemVer).
      nugetVersion: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@03e8e0922292bf0491859846a823b253d8dd06ce # v4.6.0
        with:
          versionSpec: '6.x'

      - name: Use GitVersion
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@03e8e0922292bf0491859846a823b253d8dd06ce # v4.6.0